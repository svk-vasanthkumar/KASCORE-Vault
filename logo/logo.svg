<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>

    <!-- Core Pulse Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FF8C00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>

    <!-- Vault Gradients -->
    <linearGradient id="vault-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>

    <linearGradient id="vault-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <!-- Cyber Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glass-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <linearGradient id="glass-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Digital Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 107, 0, 0.06)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 107, 0, 0.2)" />
    </pattern>

    <!-- Reusable Hexagon -->
    <g id="hexagon">
      <path d="M 0,-18 L 15.59,-9 L 15.59,9 L 0,18 L -15.59,9 L -15.59,-9 Z" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0.6" filter="url(#glow-soft)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      </path>
      <path d="M 0,-10 L 8.66,-5 L 8.66,5 L 0,10 L -8.66,5 L -8.66,-5 Z" fill="#00F5FF" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Reusable Security Node -->
    <g id="node">
      <circle cx="0" cy="0" r="8" fill="url(#core-glow)" filter="url(#glow)">
        <animate attributeName="r" values="6; 12; 6" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1; 0.4; 1" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1" fill="#00F5FF">
        <animate attributeName="r" values="1; 5; 1" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1; 0; 1" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
  </defs>

  <!-- Background Layer (Transparent) -->
  <rect width="800" height="800" fill="transparent" />

  <!-- Soft Background Glow (Breathes) -->
  <circle cx="400" cy="360" r="300" fill="url(#bg-glow)" pointer-events="none">
    <animate attributeName="opacity" values="0.3; 0.7; 0.3" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Digital Grid Texture inside the Logo Area -->
  <circle cx="400" cy="360" r="230" fill="url(#grid)" opacity="0.8" />

  <!-- Digital Constellation Ring -->
  <g>
    <circle cx="400" cy="360" r="250" fill="none" stroke="#FF6B00" stroke-width="3" stroke-dasharray="2 18" opacity="0.8" filter="url(#glow-soft)">
      <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="30s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Outer Cyber Ring (Rotates) -->
  <g>
    <circle cx="400" cy="360" r="220" fill="none" stroke="url(#ring-grad)" stroke-width="3" stroke-dasharray="120 20" opacity="0.9" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="20s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Inner Cyber Ring (Counter-Rotates) -->
  <g>
    <circle cx="400" cy="360" r="190" fill="none" stroke="#00F5FF" stroke-width="1.5" stroke-dasharray="15 30" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360 400 360" to="0 400 360" dur="15s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Moving Neon Spotlight -->
  <g>
    <circle cx="400" cy="360" r="220" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 20" opacity="0.9" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Orbiting Tiny Particles -->
  <g>
    <!-- Particle 1 (Orange) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="14s" repeatCount="indefinite" />
      <circle cx="650" cy="360" r="3" fill="#FF8C00" filter="url(#glow)" />
    </g>
    <!-- Particle 2 (Cyan) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 400 360" to="0 400 360" dur="10s" repeatCount="indefinite" />
      <circle cx="670" cy="360" r="2.5" fill="#00F5FF" filter="url(#glow)" />
    </g>
    <!-- Particle 3 (White) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="120 400 360" to="480 400 360" dur="18s" repeatCount="indefinite" />
      <circle cx="640" cy="360" r="2" fill="#FFFFFF" filter="url(#glow)" />
    </g>
  </g>

  <!-- Circuit Paths (Animated Data Flow) -->
  <g fill="none" stroke-linecap="round">
    <!-- Top Left Circuit -->
    <path d="M 160,160 L 200,160 L 230,190 L 230,230" stroke="rgba(255, 107, 0, 0.4)" stroke-width="2" />
    <path d="M 160,160 L 200,160 L 230,190 L 230,230" stroke="#FF6B00" stroke-width="2" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" from="15" to="0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <circle cx="230" cy="230" r="3" fill="#FF6B00" filter="url(#glow-soft)" />

    <!-- Top Right Circuit -->
    <path d="M 640,160 L 600,160 L 570,190 L 570,230" stroke="rgba(0, 245, 255, 0.4)" stroke-width="2" />
    <path d="M 640,160 L 600,160 L 570,190 L 570,230" stroke="#00F5FF" stroke-width="2" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" from="15" to="0" dur="2s" repeatCount="indefinite" />
    </path>
    <circle cx="570" cy="230" r="3" fill="#00F5FF" filter="url(#glow-soft)" />

    <!-- Bottom Left Circuit -->
    <path d="M 160,560 L 200,560 L 230,530 L 230,490" stroke="rgba(0, 245, 255, 0.4)" stroke-width="2" />
    <path d="M 160,560 L 200,560 L 230,530 L 230,490" stroke="#00F5FF" stroke-width="2" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" from="15" to="0" dur="1.8s" repeatCount="indefinite" />
    </path>
    <circle cx="230" cy="490" r="3" fill="#00F5FF" filter="url(#glow-soft)" />

    <!-- Bottom Right Circuit -->
    <path d="M 640,560 L 600,560 L 570,530 L 570,490" stroke="rgba(255, 107, 0, 0.4)" stroke-width="2" />
    <path d="M 640,560 L 600,560 L 570,530 L 570,490" stroke="#FF6B00" stroke-width="2" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" from="15" to="0" dur="1.3s" repeatCount="indefinite" />
    </path>
    <circle cx="570" cy="490" r="3" fill="#FF6B00" filter="url(#glow-soft)" />
  </g>

  <!-- Hexagonal Geometry at Cardinal Nodes -->
  <use href="#hexagon" x="400" y="140" />
  <use href="#hexagon" x="620" y="360" />
  <use href="#hexagon" x="400" y="580" />
  <use href="#hexagon" x="180" y="360" />

  <!-- Security Nodes (Pulsing) -->
  <use href="#node" x="400" y="140" />
  <use href="#node" x="620" y="360" />
  <use href="#node" x="400" y="580" />
  <use href="#node" x="180" y="360" />

  <!-- Center Core Pulse (Every 3 seconds) -->
  <circle cx="400" cy="360" r="80" fill="url(#core-glow)" opacity="0" pointer-events="none">
    <animate attributeName="r" values="60; 180; 60" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9; 0; 0.9" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== MAIN MONOGRAM (K & V) ==================== -->

  <!-- The Vault Core (V) -->
  <g id="vault-core">
    <!-- Left Half of V -->
    <polygon points="400,220 400,520 320,520" fill="url(#vault-left)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <!-- Right Half of V -->
    <polygon points="400,220 480,520 400,520" fill="url(#vault-right)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    
    <!-- Glass Reflection Left -->
    <polygon points="400,220 400,400 360,520 320,520" fill="url(#glass-left)" />
    <!-- Glass Reflection Right -->
    <polygon points="400,220 400,350 440,520 480,520" fill="url(#glass-right)" />
    
    <!-- Center Seam (Vault Door crack) -->
    <line x1="400" y1="220" x2="400" y2="520" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
  </g>

  <!-- The Defensive Structure (K) -->
  <g id="k-monogram">
    <!-- Glowing Underlay for K -->
    <path d="M 280,180 L 280,600" fill="none" stroke="#FF6B00" stroke-width="44" stroke-linecap="round" opacity="0.3" filter="url(#glow)" />
    <path d="M 280,280 L 500,180" fill="none" stroke="#FF6B00" stroke-width="38" stroke-linecap="round" opacity="0.3" filter="url(#glow)" />
    <path d="M 280,380 L 540,580" fill="none" stroke="#FF6B00" stroke-width="38" stroke-linecap="round" opacity="0.3" filter="url(#glow)" />

    <!-- Left Pillar (Solid White) -->
    <path d="M 280,180 L 280,600" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />
    
    <!-- Upper Right Arm -->
    <path d="M 280,280 L 500,180" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
    
    <!-- Lower Right Arm -->
    <path d="M 280,380 L 540,580" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />

    <!-- Cyber Nodes on the K Arms -->
    <!-- Node on Upper Arm -->
    <circle cx="390" cy="230" r="4" fill="#00F5FF" filter="url(#glow-soft)">
      <animate attributeName="r" values="3; 6; 3" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <!-- Node on Lower Arm -->
    <circle cx="410" cy="480" r="4" fill="#00F5FF" filter="url(#glow-soft)">
      <animate attributeName="r" values="4; 7; 4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <!-- Node on Left Pillar -->
    <circle cx="296" cy="390" r="4" fill="#FFFFFF" filter="url(#glow-soft)">
      <animate attributeName="r" values="2; 5; 2" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  
  <g id="typography">
    <!-- Separator Line -->
    <line x1="340" y1="685" x2="460" y2="685" stroke="url(#ring-grad)" stroke-width="2" opacity="0.6" />

    <!-- Brand Name -->
    <text x="400" y="660" font-family="'Inter', 'Segoe UI', Arial, Helvetica, sans-serif" font-weight="900" font-size="48" fill="#FFFFFF" text-anchor="middle" letter-spacing="6" filter="url(#glow-soft)">KASCORE</text>
    
    <!-- Product Name -->
    <text x="400" y="715" font-family="'Inter', 'Segoe UI', Arial, Helvetica, sans-serif" font-weight="300" font-size="26" fill="#FF8C00" text-anchor="middle" letter-spacing="10" opacity="0.9">Vault</text>
  </g>

</svg>